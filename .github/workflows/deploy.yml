name: "Build and Deploy Lambda Function"

on:
  push:
    branches:
      - main

# Need ID token write permission to use OIDC
permissions:
  id-token: write
  contents: read
jobs:
  build:
    name: "Build and Deploy"
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_POLICY_ARN }}
          aws-region: ap-northeast-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: "micropen/summary-proxy-lambda-node"
          IMAGE_TAG: ${{ github.sha }}
          LAMBDA_FUNCTION_NAME: "MicropenSummaryProxy"
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          aws lambda update-function-code --function-name $LAMBDA_FUNCTION_NAME --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
